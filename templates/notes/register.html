<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#eef2f7;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;
        }

        .register-box{
            width:450px;

            background:white;

            padding:35px;

            border-radius:15px;

            box-shadow:0 5px 20px rgba(0,0,0,0.1);

            text-align:center;
        }

        h1{
            color:#2563eb;
            margin-bottom:10px;
        }

        .subtitle{
            color:#666;
            margin-bottom:25px;
        }

        form{
            text-align:left;
        }

        form p{
            margin-bottom:15px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-bottom:5px;
        }

        input{
            width:100%;

            padding:12px;

            border:1px solid #d1d5db;

            border-radius:8px;

            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        .helptext{
            font-size:12px;
            color:#666;
        }

        ul{
            margin-top:5px;
            margin-left:20px;
            color:#666;
            font-size:12px;
        }

        .btn{
            width:100%;

            background:#2563eb;

            color:white;

            border:none;

            padding:12px;

            border-radius:8px;

            font-size:16px;

            cursor:pointer;

            margin-top:10px;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .login-link{
            margin-top:20px;
            text-align:center;
        }

        .login-link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h1>📚 Create Account</h1>

    <p class="subtitle">
        Join Student Notes Sharing System
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Register
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login/">Login</a>
    </div>

</div>
