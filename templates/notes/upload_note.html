<!DOCTYPE html>
<html>
<head>
    <title>Upload Notes</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#eef2f7;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;
        }

        .upload-box{
            width:500px;

            background:white;

            padding:35px;

            border-radius:15px;

            box-shadow:0 5px 20px rgba(0,0,0,0.1);

            text-align:center;
        }

        h1{
            color:#2563eb;
            margin-bottom:10px;
        }

        .subtitle{
            color:#666;
            margin-bottom:25px;
        }

        form{
            text-align:left;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-bottom:6px;
        }

        input,
        select,
        textarea{
            width:100%;

            padding:12px;

            border:1px solid #d1d5db;

            border-radius:8px;

            font-size:15px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border-color:#2563eb;
        }

        .btn{
            width:100%;

            background:#2563eb;

            color:white;

            border:none;

            padding:12px;

            border-radius:8px;

            font-size:16px;

            cursor:pointer;

            margin-top:10px;

            transition:0.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .back-link{
            margin-top:20px;
            text-align:center;
        }

        .back-link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="upload-box">

    <h1>📤 Upload Notes</h1>

    <p class="subtitle">
        Share your study notes with other students
    </p>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Upload Note
        </button>

    </form>

    <div class="back-link">
        <a href="/">
            ← Back to Home
        </a>
    </div>

</div>

</body>
</html>
