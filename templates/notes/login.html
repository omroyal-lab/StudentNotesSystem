<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#eef2f7;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .login-box{
            width:420px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            color:#2563eb;
            margin-bottom:10px;
        }

        .subtitle{
            color:#666;
            margin-bottom:25px;
        }

        form{
            text-align:left;
        }

        form p{
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:8px;
        }

        .btn{
            width:100%;
            background:#2563eb;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
            margin-top:10px;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        a{
            color:#2563eb;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h1>📚 Login</h1>

    <p class="subtitle">
        Student Notes Sharing System
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <br>

    <a href="/register/">
        Create New Account
    </a>

</div>

</body>
</html>
